

services:
  postgres:
    image: postgres:17
    container_name: knowledge-atlas-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: atlas_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: personal_knowledge_atlas

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U atlas_user -d personal_knowledge_atlas
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
